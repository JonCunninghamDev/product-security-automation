[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "product-security-automation"
version = "0.1.0"
description = "Evidence-driven product security automation demo"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
